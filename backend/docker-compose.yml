version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: peoplepay360_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: peoplepay360
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d peoplepay360"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: peoplepay360_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: peoplepay360_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/peoplepay360?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "peoplepay360-jwt-secret-key-2026-super-secure"
      JWT_REFRESH_SECRET: "peoplepay360-jwt-refresh-secret-key-2026-super-secure"
      LOG_LEVEL: "info"
    ports:
      - "4000:4000"

volumes:
  postgres_data:
  redis_data:
